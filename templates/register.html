<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Applicant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Register Applicant</h1>

    <p>
        Register a new applicant and generate a public key
        certificate.
    </p>

    <hr>

    {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <label>User ID</label>

        <input
            type="text"
            name="user_id"
            placeholder="Example: user2"
            required
        >

        <br><br>

        <label>Common Name</label>

        <input
            type="text"
            name="common_name"
            placeholder="Example: John Doe"
            required
        >

        <br><br>

        <label>Organization</label>

        <input
            type="text"
            name="organization"
            placeholder="Example: VTU"
            required
        >

        <br><br>

        <label>Country</label>

        <input
            type="text"
            name="country"
            value="IN"
            maxlength="2"
            required
        >

        <br><br>

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="example@gmail.com"
            required
        >

        <br><br>

        <button type="submit">
            Generate Certificate
        </button>

    </form>

    <hr>

    <div class="navigation">

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/logs">
            Audit Logs
        </a>

        <a href="/">
            Home
        </a>

    </div>

</div>

</body>

</html>
